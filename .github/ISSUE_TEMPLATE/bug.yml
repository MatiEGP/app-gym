name: Bug report
description: Something does not work as expected.
title: "fix(<area>): <short description>"
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start an empty workout
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots or logs if available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / build
      placeholder: v0.2.0 (APK) or commit SHA
