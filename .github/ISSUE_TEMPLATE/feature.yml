name: Feature (user story)
description: A vertical, testable slice of user-visible behavior.
title: 'feat(<area>): <short description>'
labels: ['type:feature']
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants what, and why.
      placeholder: As a gym user, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes. Use Given/When/Then when it helps.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Works offline (airplane mode)
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      placeholder: What this issue explicitly does NOT cover.
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      placeholder: Affected feature folders, data model changes, open questions.
