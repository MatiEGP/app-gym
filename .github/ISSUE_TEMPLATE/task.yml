name: Task (chore / docs / ci)
description: Technical work with no direct user-visible behavior.
title: "chore(<area>): <short description>"
labels: ["type:chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
